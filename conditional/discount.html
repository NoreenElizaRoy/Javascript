<!DOCTYPE html>
<html>
<body>

<script>
    let amount = Number(prompt("Enter order amount:"));

    if (amount >= 5000)
        alert("30% Discount");
    else if (amount >= 3000)
        alert("20% Discount");
    else if (amount >= 1000)
        alert("10% Discount");
    else
        alert("No Discount");
</script>

</body>
</html>
