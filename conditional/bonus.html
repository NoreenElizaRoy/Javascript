<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Bonus</title>
</head>
<body>
    <script>
        let salary = Number(prompt("Enter salary:"));

        if(salary >= 50000)
            alert("Bonus: 20%");
        else if(salary >= 30000)
            alert("Bonus: 10%");
        else
            alert("Bonus: 5%");
    </script>
    
</body>
</html>
