    <title>Positive Number</title>
</head>
<body>
    <script>
        let num1=Number(prompt("Enter the number1:"));
        let num2=Number(prompt("Enter the number2:"));
        if (num1>num1){
            document.write("Number ",num1," is largest");
        }
        else{
             document.write("Number ",num2," is largest");
        }

    </script>
    
</body>
