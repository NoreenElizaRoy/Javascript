<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positive Number</title>
</head>
<body>
    <script>
        let year=Number(prompt("Enter the year:"));
        if ( year%4==0 && year%100!==0 || year%400==0){
            document.write("Number is leap year");
        }

    </script>
    
</body>
</html>
