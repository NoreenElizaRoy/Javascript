<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
<script>
let units = Number(prompt("Enter units consumed:"));

if(units <= 100)
    alert("Low Consumption");
else if(units <= 300)
    alert("Medium Consumption");
else
    alert("High Consumption");
</script>    
    
</body>
</html>
