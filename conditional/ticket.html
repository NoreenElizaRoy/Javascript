<!DOCTYPE html>
<html>
<body>

<script>
    let age = Number(prompt("Enter your age:"));

    if (age < 5) {
        alert("Ticket Price: Free");
    }
    else if (age <= 12) {
        alert("Ticket Price: ₹100");
    }
    else if (age < 60) {
        alert("Ticket Price: ₹200");
    }
    else {
        alert("Ticket Price: ₹150");
    }
</script>

</body>
</html>
