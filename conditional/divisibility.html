<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisibility bt 5 and/or 3</title>
</head>
<body>
    <script>
        let num=Number(prompt("Enter the number:"));
        if (num%3==0 && num%5==0){
            document.write("Number ",num,"divisible by 5 and 3");
        }
        else if (num%3==0){
            document.write("Number ",num,"divisible by  3");
        }
        else if(num%5==0){
            document.write("Number ",num,"divisible by  5");
        }
        else{
            document.write("Not divisible by 5 and/or 3")
        }

    </script>
    
</body>
</html>
