<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>
let marks = Number(prompt("Enter marks:"));

if(marks >= 75)
    alert("Distinction");
else if(marks >= 60)
    alert("First Class");
else if(marks >= 50)
    alert("Second Class");
else if(marks >= 40)
    alert("Pass");
else
    alert("Fail");    
    
</script>   
    
</body>
</html>
