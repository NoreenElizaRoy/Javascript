<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competition Eligibility</title>
</head>
<body>
<script>
let age = Number(prompt("Enter age:"));
let idCard = prompt("Do you have ID Card? (yes/no)");

if (age >= 18 && idCard.toLowerCase() === "yes")
    alert("Eligible");
else
    alert("Not Eligible");
</script>    
</body>
</html>
