<!DOCTYPE html>
<html>
<head>
    <title>Voting Eligibility</title>
</head>
<body>

    <script>
        let age = Number(prompt("Enter your age:"));

        if (age >= 18) {
            document.write("Eligible to Vote");
        } else {
            document.write("Not Eligible to Vote");
        }
    </script>

</body>
</html>
