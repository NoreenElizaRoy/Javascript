<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positive Number</title>
</head>
<body>
    <script>
        let num1=Number(prompt("Enter the number1:"));
        let num2=Number(prompt("Enter the number2:"));
        let num3=Number(prompt("Enter the number3:"));
        if (num1>num2){
            if(num1>num3){
                document.write("Number ",num1," is largest");
            }
            else{
                document.write("Number ",num3," is largest");
            }        
       }
       else{
        if(num2>num3){
            document.write("Number ",num2," is largest");
        }
        else {
            document.write("Number ", num3, " is largest");
        }


       }
    </script>
    
</body>
</html>
