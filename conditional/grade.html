<!DOCTYPE html>
<html>
<head>
    <title>Voting Eligibility</title>
</head>
<body>

    <script>
        let mark = Number(prompt("Enter your mark:"));

        if (mark >= 90) {
            alert("GRADE : A");
        } 
        else if (mark >= 80) {
            alert("GRADE : B");
        } 
        else if (mark >= 70) {
            alert("GRADE : C");
        } 
        else if (mark >= 50) {
            alert("GRADE : D");
        }
        else {
            alert("FAILED");
        }
    </script>

</body>
</html>
