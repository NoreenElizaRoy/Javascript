<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=T, initial-scale=1.0">
    <title>Traffic</title>
</head>
<body>
<script>
let signal = prompt("Enter signal color:");

switch(signal.toLowerCase()) {
    case "red":
        alert("STOP");
        break;
    case "yellow":
        alert("READY");
        break;
    case "green":
        alert("GO");
        break;
    default:
        alert("Invalid Signal");
}
</script>
    
</body>
</html>
