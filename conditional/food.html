<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>
let code = Number(prompt("Enter menu code:"));

switch(code){
    case 1:
        alert("Burger");
        break;
    case 2:
        alert("Pizza");
        break;
    case 3:
        alert("Sandwich");
        break;
    default:
        alert("Invalid Code");
}
</script>    
    
</body>
</html>
