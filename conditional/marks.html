<!DOCTYPE html>
<html>
<head>
    <title>Voting Eligibility</title>
</head>
<body>

    <script>
        let mark = Number(prompt("Enter your mark:"));

        if (mark >= 40) {
            document.write("PASSED");
        } else {
            document.write("FAILED");
        }
    </script>

</body>
</html>
